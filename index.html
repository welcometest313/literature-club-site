<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文学社随笔平台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h1>文学社随笔平台</h1>

<div id="authArea">
  <h3>注册 / 登录</h3>
  <div>
    邮箱：<input type="email" id="email" placeholder="填写邮箱">
  </div>
  <div style="margin:8px 0;">
    密码：<input type="password" id="pwd" placeholder="至少6位">
  </div>
  <button onclick="doRegister()">注册账号</button>
  <button onclick="doLogin()">登录</button>
</div>

<div id="mainArea" style="display:none;">
  <h3>✅登录成功，可以发布随笔</h3>
  <textarea id="articleInput" placeholder="写下你的文字..." rows="6" cols="60"></textarea>
  <br>
  <button onclick="postArticle()">发布匿名随笔</button>
  <hr>
  <h4>随笔列表</h4>
  <div id="articleList"></div>
</div>

<script>
// ============填入你的Supabase信息============
const SUPABASE_URL = "https://seranmtxkwjawpsvbhzh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_q5by4Lr66W6CgPpitMe-VQ_b9_j_IUW";

const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 注册
async function doRegister(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('pwd').value;
  alert("正在提交注册，请等待");
  const {data,error}=await supabase.auth.signUp({email,password});
  if(error){
    alert("注册失败："+error.message);
  }else{
    alert("注册请求完成，请前往邮箱验证");
  }
}

// 登录
async function doLogin(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('pwd').value;
  alert("正在登录，请等待");
  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error){
    alert("登录失败："+error.message);
  }else{
    alert("登录成功！");
    document.getElementById('authArea').style.display='none';
    document.getElementById('mainArea').style.display='block';
  }
}

//发布随笔
async function postArticle(){
  const content=document.getElementById('articleInput').value;
  const {error}=await supabase.from('posts').insert([{content:content,anonymous:true}]);
  if(error){
    alert("发布失败："+error.message);
  }else{
    alert("发布成功！刷新页面查看");
  }
}
</script>
</body>
</html>
